# render.yaml : à placer À LA RACINE du dépôt GitHub (à côté des dossiers backend/ et frontend/)
# Déploie : 1 base PostgreSQL + 1 API Django + 1 site React (statique)

databases:
  - name: gestion-magasin-db
    databaseName: magasin_db
    user: magasin
    plan: free            # ⚠️ la base gratuite expire après 30 jours (voir explications)
    region: frankfurt     # même région que l'API (sinon la connexion privée ne marche pas)
    ipAllowList: []       # accessible uniquement par vos services Render (plus sûr)

services:
  # ---------------------------------------------------------------- BACKEND (Django)
  - type: web
    name: gestion-magasin-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input &&
      python manage.py creer_comptes_demo
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true          # Render génère une clé secrète aléatoire
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-magasin-db
          property: connectionString
      # À remplir dans le Dashboard avec l'adresse du site React (voir étape 3)
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Mots de passe des comptes de démonstration (ne gardez pas ceux du README !)
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_VENDEUR_PASSWORD
        sync: false
      # Emails "mot de passe oublié" (facultatif) : décommentez si vous utilisez Brevo
      # - key: BREVO_API_KEY
      #   sync: false
      # - key: EMAIL_EXPEDITEUR
      #   sync: false

  # ---------------------------------------------------------------- FRONTEND (React + Vite)
  - type: web
    name: gestion-magasin-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # À remplir avec l'adresse de l'API + /api (voir étape 3)
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router : toutes les pages renvoient index.html (équivalent de vercel.json)
      - type: rewrite
        source: /*
        destination: /index.html
